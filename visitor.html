<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Counter</title>
  <link rel="stylesheet" href="css/visitor.css">
</head>
<body>
  <h1>Visitor Statistics</h1>
  <div class="counter-box">
    <p>Total Visitors:</p>
    <span id="totalVisitors">Loading...</span>
  </div>
  <div class="counter-box">
    <p>Today's Visitors:</p>
    <span id="dailyVisitors">Loading...</span>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase init
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "real-pesky.firebaseapp.com",
      projectId: "real-pesky",
      storageBucket: "real-pesky.appspot.com", // ✅ fixed
      messagingSenderId: "629793050464",
      appId: "1:629793050464:web:30fe462acfe0e71c605805",
      measurementId: "G-RRM9QSCHV2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function getTodayDate() {
      return new Date().toISOString().split("T")[0];
    }

    // Increment counters
    const statsRef = db.collection("analytics").doc("stats");
    statsRef.set({ totalVisitors: firebase.firestore.FieldValue.increment(1) }, { merge: true });

    const today = getTodayDate();
    const dailyRef = db.collection("dailyVisitors").doc(today);
    dailyRef.set({ visitors: firebase.firestore.FieldValue.increment(1) }, { merge: true });

    // Display counters
    statsRef.onSnapshot(doc => {
      if (doc.exists) {
        document.getElementById("totalVisitors").innerText = doc.data().totalVisitors || 0;
      }
    });

    dailyRef.onSnapshot(doc => {
      if (doc.exists) {
        document.getElementById("dailyVisitors").innerText = doc.data().visitors || 0;
      }
    });
  </script>
</body>
</html>
