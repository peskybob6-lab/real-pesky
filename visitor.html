<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    .counter-box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      margin: 20px auto;
      width: 300px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .counter-box span {
      font-size: 2em;
      font-weight: bold;
      display: block;
      margin-top: 10px;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <h1>Visitor Statistics</h1>
  <div class="counter-box">
    <p>Total Visitors:</p>
    <span id="totalVisitors">Loading...</span>
  </div>
  <div class="counter-box">
    <p>Today's Visitors:</p>
    <span id="dailyVisitors">Loading...</span>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Firebase init
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "real-pesky.firebaseapp.com",
      projectId: "real-pesky",
      storageBucket: "real-pesky.appspot.com", // ✅ fixed
      messagingSenderId: "629793050464",
      appId: "1:629793050464:web:30fe462acfe0e71c605805",
      measurementId: "G-RRM9QSCHV2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function getTodayDate() {
      return new Date().toISOString().split("T")[0];
    }

    // Increment counters
    const statsRef = db.collection("analytics").doc("stats");
    statsRef.set({ totalVisitors: firebase.firestore.FieldValue.increment(1) }, { merge: true });

    const today = getTodayDate();
    const dailyRef = db.collection("dailyVisitors").doc(today);
    dailyRef.set({ visitors: firebase.firestore.FieldValue.increment(1) }, { merge: true });

    // Display counters
    statsRef.onSnapshot(doc => {
      if (doc.exists) {
        document.getElementById("totalVisitors").innerText = doc.data().totalVisitors || 0;
      }
    });

    dailyRef.onSnapshot(doc => {
      if (doc.exists) {
        document.getElementById("dailyVisitors").innerText = doc.data().visitors || 0;
      }
    });
  </script>
</body>
</html>
